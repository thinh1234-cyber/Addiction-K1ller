<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kill Addiction Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body data-theme="dark">
  <div class="card">
    <div class="header">
      <div class="theme-picker">
        <select id="theme-select" title="Chọn Theme UI">
          <option value="dark">Dark Slate</option>
          <option value="cappuccino">Cappuccino</option>
          <option value="pink">Sakura Pink</option>
          <option value="light-white">Light White</option>
          <option value="gray">Slate Gray</option>
          <option value="dracula">Dracula</option>
          <option value="one-dark-pro">One Dark Pro</option>
          <option value="monokai">Monokai Pro</option>
          <option value="cyberpunk">Cyberpunk</option>
          <option value="solarized-dark">Solarized Teal</option>
        </select>
      </div>
      <div class="header-right">
        <button id="settings-btn" class="icon-btn" title="Mở Cài Đặt & Thống Kê Thời Gian">⚙️</button>
      </div>
    </div>

    <div class="title-group">
      <h2>Kill Addiction</h2>
      <p class="subtitle"></p>
    </div>

    <div class="toggle-list">
      <div class="toggle-item">
        <div class="toggle-label">
          <span class="platform-tag fb">FB</span>
          <span id="label-facebook">Facebook</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="facebook">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-item">
        <div class="toggle-label">
          <span class="platform-tag yt">YT</span>
          <span id="label-youtube">YouTube</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="youtube">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-item">
        <div class="toggle-label">
          <span class="platform-tag tt">TT</span>
          <span id="label-tiktok">TikTok</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="tiktok">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-item">
        <div class="toggle-label">
          <span class="platform-tag ig">IG</span>
          <span id="label-instagram">Instagram</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="instagram">
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-item">
        <div class="toggle-label">
          <span class="platform-tag th">TH</span>
          <span id="label-threads">Threads</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="threads">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="divider"></div>

    <div class="action-buttons">
      <button id="inspect-btn" class="btn btn-primary">Chỉ định ẩn phần tử</button>
      <button id="reset-zapped-btn" class="btn btn-secondary">Khôi phục phần tử đã ẩn</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
